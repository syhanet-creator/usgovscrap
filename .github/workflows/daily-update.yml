name: Daily update

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scrape.py

      - name: Sanity check
        run: |
          python - <<'EOF'
          import json, sys
          d = json.load(open("data.json", encoding="utf-8"))
          items = [i for a in d["agencies"] for i in a["items"]]
          untranslated = sum(i["title_ko"] == i["title_en"] for i in items)
          print(f"{len(items)} items, {untranslated} untranslated")
          if len(items) < 10:
              sys.exit("too few items; keeping the previous data.json")
          if untranslated > len(items) // 2:
              sys.exit("translation mostly failed; keeping the previous data.json")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: daily data update"
          git push
